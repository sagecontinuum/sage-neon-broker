# =============================================================================
# Access rules, applied every time the broker starts, by the sage-kafka
# container's startup script (see podman/kafka-mirror-pod.yaml). Needs the
# authorizer enabled in sage-kafka.properties (authorizer.class.name and
# super.users). Check the result with:
#   podman logs kafka-mirror-sage-kafka 2>&1 | grep kafka-acls
#
# Each "acl" line takes the usual kafka-acls.sh options. Adding a rule that
# already exists does nothing, so this file can be applied over and over.
# Rules are only ever added: deleting a line here doesn't remove the rule from
# the broker. To remove one, add the same line with --remove ... --force, or run
# that kafka-acls.sh command by hand.
#
# 'User:*' means everyone without super-user rights. Readers connect to port
# 9094 without a login and are User:ANONYMOUS, which 'User:*' includes.
# =============================================================================

# Read-only access to the mirrored topics (names starting with "reading.")
acl --add --allow-principal 'User:*' --operation Read --operation Describe \
    --topic reading. --resource-pattern-type prefixed

# See every consumer group, and use groups whose names start with "reader-"
acl --add --allow-principal 'User:*' --operation Describe --group '*'
acl --add --allow-principal 'User:*' --operation Read \
    --group reader- --resource-pattern-type prefixed
