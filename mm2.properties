# =============================================================================
# MirrorMaker 2: copy selected topics from an existing Kafka server
# ("primary", the MM2 source) into the single-broker cluster defined in
# docker-compose.yml ("mirror", the MM2 target).
#
# MM2 only reads this file at startup. After editing it, run:
#     docker compose restart mirrormaker
#
# This is a Java .properties file: comments must be on their own line (a "#"
# after a value becomes part of the value), and a backslash is dropped unless
# you double it.
# =============================================================================

clusters = primary, mirror

# --- Source: the existing Kafka server ---------------------------------------
# CHANGE THIS. It must be reachable from inside the mirrormaker container, and
# so must every address the source advertises (its advertised.listeners).
primary.bootstrap.servers = ${env:NEON_BOOTSTRAP_SERVER}
primary.security.protocol = SASL_PLAINTEXT
primary.sasl.mechanism = SCRAM-SHA-512
primary.sasl.jaas.config = org.apache.kafka.common.security.scram.ScramLoginModule required username="${env:NEON_USERNAME}" password="${env:NEON_PASSWORD}";

# --- Target: the broker from docker-compose.yml (internal listener) -----------
mirror.bootstrap.servers = localhost:9092

# The mirror requires SASL/SCRAM. MirrorMaker logs in as "mm2"; the password is
# read from the MIRROR_MM2_PASSWORD variable (set in secrets.env), so it isn't
# stored in this file.
mirror.security.protocol = SASL_PLAINTEXT
mirror.sasl.mechanism = SCRAM-SHA-512
mirror.sasl.jaas.config = org.apache.kafka.common.security.scram.ScramLoginModule required username="mm2" password="${env:MIRROR_MM2_PASSWORD}";

# Lets this file read environment variables with ${env:NAME}.
config.providers = env
config.providers.env.class = org.apache.kafka.common.config.provider.EnvVarConfigProvider

# --- Replication flow: one way, primary -> mirror -----------------------------
primary->mirror.enabled = true
mirror->primary.enabled = false

# CHANGE THIS. Topics to copy: comma-separated names and/or regexes, each
# matched against the WHOLE topic name
primary->mirror.topics = reading.sensor.li7200_raw, reading.sensor.li7200_metrics, reading.sensor.csat3, reading.sensor.csat3b

# Let MirrorMaker's producer send records of up to 5 MiB (request by Steve for the li8100a sensor)
mirror.producer.max.request.size = 5242880

# Optional: topics to skip even when matched above. Setting this REPLACES
# MM2's default exclude list, so keep the first three entries.
# primary->mirror.topics.exclude = mm2.*[.]internal, .*[.]replica, __.*, customer-test-.*

# Keep topic names identical on the mirror ("orders" stays "orders").
# Remove this line to get prefixed names instead ("primary.orders").
replication.policy.class = org.apache.kafka.connect.mirror.IdentityReplicationPolicy

# --- Consumer group offsets ----------------------------------------------------
# Translate committed consumer positions so applications can switch over.
primary->mirror.sync.group.offsets.enabled = true
primary->mirror.sync.group.offsets.interval.seconds = 15
primary->mirror.emit.checkpoints.interval.seconds = 15

# --- Leave the source untouched --------------------------------------------------
# Keep MM2's offset bookkeeping on the mirror. Together with "--clusters mirror"
# in docker-compose.yml, MM2 only ever reads from the source.
offset-syncs.topic.location = target

# The mirror has no ACL authorizer, so don't try to copy ACLs onto it.
sync.topic.acls.enabled = false

# --- Discovery ---------------------------------------------------------------------
# How often to look for new matching topics and consumer groups (default 600s).
refresh.topics.interval.seconds = 60
refresh.groups.interval.seconds = 60

# --- Single-broker target: every replication factor must be 1 ---------------------
replication.factor = 1
checkpoints.topic.replication.factor = 1
heartbeats.topic.replication.factor = 1
offset-syncs.topic.replication.factor = 1
offset.storage.replication.factor = 1
config.storage.replication.factor = 1
status.storage.replication.factor = 1

# --- Throughput ----------------------------------------------------------------------
# Upper bound on parallel copy tasks (MM2 never uses more than there are partitions).
tasks.max = 4

# Don't copy records from aborted transactions.
primary.consumer.isolation.level = read_committed

# By default the first run copies everything the source still retains.
# To copy only data produced from now on, uncomment before the first start:
primary.consumer.auto.offset.reset = latest
