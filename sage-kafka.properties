# =============================================================================
# Broker configuration for the mirror (sage-kafka container).
#
# advertised.listeners is set on the command line in docker-compose.yml, since
# it depends on MIRROR_ADVERTISED_HOST and MIRROR_EXTERNAL_PORT.
# Changes here take effect after:  docker compose restart sage-kafka
# =============================================================================

# --- KRaft: one node acting as both broker and controller ---------------------
process.roles=broker,controller
node.id=1
controller.quorum.voters=1@127.0.0.1:9093
controller.listener.names=CONTROLLER

# --- Listeners -----------------------------------------------------------------
#   INTERNAL    SASL/SCRAM   containers on the kafka-mirror network (MirrorMaker)
#   EXTERNAL    SASL/SCRAM   everything outside Docker, via the published port
#   LOCAL       no auth      loopback only: the healthcheck and admin commands
#                            run with "docker compose exec"
#   CONTROLLER  no auth      loopback only: KRaft controller traffic
# LOCAL and CONTROLLER listen on 127.0.0.1 inside the container, so nothing
# outside the container can reach them.
listeners=INTERNAL://:9092,EXTERNAL://:9094,LOCAL://127.0.0.1:9095,CONTROLLER://127.0.0.1:9093
listener.security.protocol.map=INTERNAL:SASL_PLAINTEXT,EXTERNAL:PLAINTEXT,LOCAL:SASL_PLAINTEXT,CONTROLLER:SASL_PLAINTEXT

# A single broker has no broker-to-broker traffic, so the loopback listener can
# double as the inter-broker listener. If you ever add brokers, switch this to a
# SASL listener and give the brokers their own SCRAM credentials.
inter.broker.listener.name=LOCAL
sasl.mechanism.inter.broker.protocol=PLAIN
sasl.mechanism.controller.protocol=PLAIN

# --- Logins ------------------------------------------------------------------------
# INTERNAL: SCRAM. The "mm2" user lives in the cluster metadata and is created on
# first start by sage-kafka-start.sh.
listener.name.internal.sasl.enabled.mechanisms=SCRAM-SHA-512
listener.name.internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
# LOCAL and CONTROLLER: PLAIN, with the internal "admin" user. Their
# listener.name.*.plain.sasl.jaas.config lines hold the generated password, so
# sage-kafka-start.sh adds them at startup instead of keeping them in this file.
listener.name.local.sasl.enabled.mechanisms=PLAIN
listener.name.controller.sasl.enabled.mechanisms=PLAIN

# --- Authorization -------------------------------------------------------------------
# Anyone connecting without a login (EXTERNAL) is User:ANONYMOUS and may do only
# what kafka-acls.conf allows. admin and mm2 may do everything.
authorizer.class.name=org.apache.kafka.metadata.authorizer.StandardAuthorizer
super.users=User:admin;User:mm2

# --- Single broker: internal topics can only have one replica ---------------------
offsets.topic.replication.factor=1
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1

# --- Mirror hygiene ------------------------------------------------------------------
# Only MirrorMaker should create topics on the mirror.
auto.create.topics.enable=false

# Retention for mirrored topics that don't set their own on the source. MM2
# copies per-topic settings, not the source broker's defaults, so match your
# source's log.retention.hours here.
log.retention.hours=168

group.initial.rebalance.delay.ms=0
log.dirs=/var/lib/kafka/data

# Accept records of up to 5 MiB (request by Steve for the li8100a sensor)
message.max.bytes=5242880
